<text class="s" x="230.0" y="651">OpenAlex: подобласть (из 250) → темы внутри</text>
<text class="s" x="230.0" y="668">промпт v1_select_by_levels.md</text>
<rect class="km" x="308" y="580" width="104" height="20" rx="10"/>
