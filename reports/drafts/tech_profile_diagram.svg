<text class="s" x="435.0" y="494">77 фраз, найденных ≥ 2 прогонами из 3 · разбиение самого согласованного прогона</text>
<path class="ln" d="M285.0,512 V551.0 H230.0 V587" marker-end="url(#a)"/>
<path class="ln" d="M585.0,512 V556.0 H640.0 V597" marker-end="url(#a)"/>
