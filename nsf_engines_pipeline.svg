<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1450" width="1280" height="1450">
  <title>NSF Engines: от людей и партнёров к базе знаний</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="A" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, "DejaVu Sans", sans-serif; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.5; }
      .frame { fill: none; stroke: #222; stroke-width: 1.5; }
      .hold { fill: #fff; stroke: #888; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .on  { fill: #e3ecf9; stroke: #4a6fa5; stroke-width: 2.5; }
      .off { fill: #f5f6f8; stroke: #c9d0da; stroke-width: 1.2; }
      .t   { font-size: 16px; font-weight: 700; fill: #111; text-anchor: middle; }
      .ts  { font-size: 13.5px; font-weight: 700; fill: #111; text-anchor: middle; }
      .tf  { font-size: 14.5px; font-weight: 700; fill: #111; text-anchor: middle; }
      .s   { font-size: 12px; fill: #555; text-anchor: middle; }
      .n   { font-size: 12px; fill: #111; text-anchor: middle; }
      .m   { font-size: 11.5px; fill: #3a3a3a; text-anchor: middle; font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
      .offt { font-size: 13.5px; font-weight: 600; fill: #8a8f97; text-anchor: middle; }
      .offs { font-size: 11.5px; fill: #a0a5ac; text-anchor: middle; }
      .ons  { font-size: 11.5px; fill: #2d3f5c; text-anchor: middle; }
      .ln  { fill: none; stroke: #222; stroke-width: 1.5; }
      .LN  { fill: none; stroke: #111; stroke-width: 4; stroke-linejoin: round; }
      .dl  { fill: none; stroke: #888; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .br  { fill: none; stroke: #9a9a9a; stroke-width: 1.2; }
      .brt { font-size: 12px; fill: #777; text-anchor: middle; letter-spacing: 0.3px; }
      .u   { text-decoration: underline; }
    </style>
  </defs>

  <!-- ===== Скобки слева: полуручные / автоматические шаги ===== -->
  <path class="br" d="M32,40 H24 V548 H32"/>
  <text class="brt" transform="translate(14,294) rotate(-90)">полуручные шаги · проверка вручную</text>
  <path class="br" d="M32,600 H24 V1360 H32"/>
  <text class="brt" transform="translate(14,980) rotate(-90)">автоматически · targets · одинаково для 12 Engines</text>

  <!-- ===== Ряд 1: входы ===== -->
  <rect class="box" x="285" y="40" width="300" height="90"/>
  <text class="t" x="435" y="64">NSF Award API</text>
  <text class="s" x="435" y="84">12 Engines · Cohort 2 · программа 301Y00</text>
  <text class="n" x="435" y="102">PI + Co-PI · N = …</text>
  <text class="m" x="435" y="121">nsf_awards</text>

  <rect class="box" x="695" y="40" width="300" height="90"/>
  <text class="t" x="845" y="64">Сайты Engine</text>
  <text class="s" x="845" y="84">команды · партнёры · логотипы</text>
  <text class="n" x="845" y="102">страницы отобраны вручную, URL на строку</text>
  <text class="m" x="845" y="121">site_pages</text>

  <!-- стрелки ряд 1 → 2 -->
  <path class="ln" d="M435,130 V178" marker-end="url(#a)"/>
  <path class="ln" d="M845,130 V178" marker-end="url(#a)"/>
  <path class="ln" d="M760,130 V155 H520 V178" marker-end="url(#a)"/>
  <text class="s" x="640" y="150" style="font-size:11px">люди с сайтов</text>

  <!-- ===== Ряд 2: реестры ===== -->
  <rect class="box" x="285" y="180" width="300" height="90"/>
  <text class="t" x="435" y="204">Единый реестр людей</text>
  <text class="s" x="435" y="224">PI ∪ люди с сайтов · дубли сведены</text>
  <text class="n" x="435" y="242">N = …</text>
  <text class="m" x="435" y="261">people</text>

  <rect class="box" x="695" y="180" width="300" height="90"/>
  <text class="t" x="845" y="204">Реестр партнёров</text>
  <text class="s" x="845" y="224">все упомянутые организации</text>
  <text class="n" x="845" y="242">N = …</text>
  <text class="m" x="845" y="261">partners</text>

  <path class="ln" d="M435,270 V318" marker-end="url(#a)"/>
  <path class="ln" d="M845,270 V318" marker-end="url(#a)"/>

  <!-- ===== Ряд 3: рамка «Люди: 4 роли» ===== -->
  <rect class="frame" x="250" y="320" width="370" height="228"/>
  <text class="tf" x="435" y="344">Классификация людей · 4 роли</text>
  <text class="s" x="435" y="362">для каждого: основание + ссылка</text>

  <rect class="off" x="262" y="376" width="168" height="72"/>
  <text class="offt" x="346" y="402">Корпоративный R&amp;D</text>
  <text class="offs" x="346" y="421">CTO · патенты компании</text>
  <text class="offs" x="346" y="437">→ через партнёра</text>

  <rect class="off" x="440" y="376" width="168" height="72"/>
  <text class="offt" x="524" y="402">Организатор</text>
  <text class="offs" x="524" y="421">палаты · фонды</text>
  <text class="offs" x="524" y="437">эконом. развитие</text>

  <rect class="on" x="262" y="460" width="168" height="76"/>
  <text class="ts" x="346" y="486">Исследователь</text>
  <text class="ons" x="346" y="505">работы в OpenAlex</text>
  <text class="ons" x="346" y="521">h-index · патенты</text>

  <rect class="on" x="440" y="460" width="168" height="76"/>
  <text class="ts" x="524" y="486">Администратор науки</text>
  <text class="ons" x="524" y="505">VP for Research · провост</text>
  <text class="ons" x="524" y="521">директор института</text>

  <!-- ===== Ряд 3: рамка «Партнёры: 4 типа» ===== -->
  <rect class="frame" x="660" y="320" width="370" height="228"/>
  <text class="tf" x="845" y="344">Классификация партнёров · 4 типа</text>
  <text class="s" x="845" y="362">по числу работ и патентов, не на глаз</text>

  <rect class="off" x="672" y="376" width="168" height="72"/>
  <text class="offt" x="756" y="402">Пользователи</text>
  <text class="offs" x="756" y="421">заводы · операторы</text>
  <text class="offs" x="756" y="437">мало работ и патентов</text>

  <rect class="off" x="850" y="376" width="168" height="72"/>
  <text class="offt" x="934" y="402">Посредники</text>
  <text class="offs" x="934" y="421">инкубаторы · венчур</text>
  <text class="offs" x="934" y="437">кластеры</text>

  <rect class="on" x="672" y="460" width="168" height="76"/>
  <text class="ts" x="756" y="486">Производители знания</text>
  <text class="ons" x="756" y="505">университеты · нацлабы</text>
  <text class="ons" x="756" y="521">ERC · корп. R&amp;D</text>

  <rect class="off" x="850" y="460" width="168" height="76"/>
  <text class="offt" x="934" y="486">Кадры и сообщество</text>
  <text class="offs" x="934" y="505">колледжи · workforce</text>
  <text class="offs" x="934" y="521">программы обучения</text>

  <!-- боковые входы ряда 3 -->
  <rect class="box" x="40" y="388" width="175" height="104"/>
  <text class="ts" x="127" y="412">Сопоставление людей</text>
  <text class="s" x="127" y="432">OpenAlex author ID</text>
  <text class="s" x="127" y="448">ORCID</text>
  <text class="s" x="127" y="464">PatentsView inventor</text>
  <text class="s" x="127" y="482" style="font-style:italic">имя + текущая орг.</text>
  <path class="ln" d="M215,440 H248" marker-end="url(#a)"/>

  <rect class="box" x="1065" y="388" width="185" height="104"/>
  <text class="ts" x="1157" y="412">Сопоставление орг.</text>
  <text class="s" x="1157" y="432">ROR</text>
  <text class="s" x="1157" y="448">OpenAlex institutions</text>
  <text class="s" x="1157" y="464">PatentsView assignee</text>
  <text class="s" x="1157" y="482" style="font-style:italic">имя + локация в США</text>
  <path class="ln" d="M1065,440 H1032" marker-end="url(#a)"/>

  <!-- ===== Жирный путь: выбранные роли → ряд 4 ===== -->
  <path class="LN" d="M346,536 V572 H524 V536"/>
  <path class="LN" d="M435,572 V598" marker-end="url(#A)"/>
  <path class="LN" d="M756,536 V572 H845 V598" marker-end="url(#A)"/>

  <!-- ===== Ряд 4: выход людей и организаций ===== -->
  <rect class="box" x="285" y="600" width="300" height="90"/>
  <text class="t" x="435" y="624">Работы и патенты людей</text>
  <text class="s" x="435" y="644">по ID автора и изобретателя</text>
  <text class="n" x="435" y="662">N работ · N патентов</text>
  <text class="m" x="435" y="681">people_output</text>

  <rect class="box" x="695" y="600" width="300" height="90"/>
  <text class="t" x="845" y="624">Работы и патенты организаций</text>
  <text class="s" x="845" y="644">вне региона: только совместные с ним</text>
  <text class="n" x="845" y="662">N работ · N патентов</text>
  <text class="m" x="845" y="681">org_output</text>

  <path class="LN" d="M435,690 V758" marker-end="url(#A)"/>
  <path class="LN" d="M845,690 V758" marker-end="url(#A)"/>

  <!-- ===== Ряд 5: рамка «Фильтр» ===== -->
  <rect class="frame" x="330" y="760" width="620" height="140"/>
  <text class="tf" x="640" y="784">Фильтр выхода</text>
  <text class="s" x="640" y="802">все три условия одновременно</text>

  <rect class="on" x="345" y="816" width="190" height="72"/>
  <text class="ts" x="440" y="842">Время</text>
  <text class="ons" x="440" y="861">от (грант − 5 лет) и дальше</text>
  <text class="ons" x="440" y="877">патенты: дата приоритета</text>

  <rect class="on" x="545" y="816" width="190" height="72"/>
  <text class="ts" x="640" y="842">География</text>
  <text class="ons" x="640" y="861">штаты Engine</text>
  <text class="ons" x="640" y="877">аффилиация · адрес изобр.</text>

  <rect class="on" x="745" y="816" width="190" height="72"/>
  <text class="ts" x="840" y="842">Технология</text>
  <text class="ons" x="840" y="861">темы OpenAlex</text>
  <text class="ons" x="840" y="877">+ классы CPC</text>

  <!-- боковой вход: профиль технологии -->
  <rect class="box" x="1065" y="796" width="185" height="112"/>
  <text class="ts" x="1157" y="820">Профиль технологии</text>
  <text class="s" x="1157" y="840">название → аннотация</text>
  <text class="s" x="1157" y="856">3–5 утверждений</text>
  <text class="s" x="1157" y="872" style="font-style:italic">проверка вручную</text>
  <text class="m" x="1157" y="895">tech_profile</text>
  <path class="ln" d="M1065,852 H952" marker-end="url(#a)"/>

  <path class="LN" d="M640,900 V948" marker-end="url(#A)"/>

  <!-- ===== Ряд 6: база знаний ===== -->
  <rect class="box" x="440" y="950" width="400" height="90" style="stroke-width:2.5"/>
  <text class="t" x="640" y="975">База знаний Engine</text>
  <text class="s" x="640" y="995">люди + производители знания, после фильтра</text>
  <text class="n" x="640" y="1013">12 Engines · N работ · N патентов</text>
  <text class="m" x="640" y="1032">knowledge_base</text>

  <path class="LN" d="M640,1040 V1088" marker-end="url(#A)"/>

  <!-- ===== Ряд 7: метрики ===== -->
  <rect class="frame" x="250" y="1090" width="780" height="140"/>
  <text class="tf" x="640" y="1114">Метрики</text>
  <text class="s" x="640" y="1132">по каждому Engine, сравнение с США</text>

  <rect class="on" x="262" y="1146" width="180" height="72"/>
  <text class="ts" x="352" y="1172">Объём и LQ</text>
  <text class="ons" x="352" y="1191">доля региона в технологии</text>
  <text class="ons" x="352" y="1207">относительно США</text>

  <rect class="on" x="454" y="1146" width="180" height="72"/>
  <text class="ts" x="544" y="1172">Сотрудничество</text>
  <text class="ons" x="544" y="1191">доля совместных работ</text>
  <text class="ons" x="544" y="1207">внутри региона</text>

  <rect class="on" x="646" y="1146" width="180" height="72"/>
  <text class="ts" x="736" y="1172">Местные патенты</text>
  <text class="ons" x="736" y="1191">доля правообладателей</text>
  <text class="ons" x="736" y="1207">из региона</text>

  <rect class="on" x="838" y="1146" width="180" height="72"/>
  <text class="ts" x="928" y="1172">Опора на науку</text>
  <text class="ons" x="928" y="1191">ссылки патент → статья</text>
  <text class="ons" x="928" y="1207">из патентов региона</text>

  <!-- боковой вход: Reliance on Science -->
  <rect class="box" x="1065" y="1130" width="185" height="96"/>
  <text class="ts" x="1157" y="1154">Reliance on Science</text>
  <text class="s u" x="1157" y="1174">Marx &amp; Fuegi (2020)</text>
  <text class="s" x="1157" y="1192">связи патент → статья</text>
  <text class="s" x="1157" y="1208">уже с OpenAlex ID</text>
  <path class="ln" d="M1065,1182 H1032" marker-end="url(#a)"/>

  <!-- боковой вход на холде: датасет преподавателя -->
  <rect class="hold" x="40" y="1130" width="175" height="96"/>
  <text class="ts" x="127" y="1154" style="fill:#777">Датасет</text>
  <text class="ts" x="127" y="1172" style="fill:#777">преподавателя</text>
  <text class="s" x="127" y="1192" style="fill:#999">метрики по регионам</text>
  <text class="s" x="127" y="1210" style="fill:#999;font-style:italic">на холде</text>
  <path class="dl" d="M215,1182 H248" marker-end="url(#a)"/>

  <path class="ln" d="M640,1230 V1278" marker-end="url(#a)"/>

  <!-- ===== Ряд 8: отчёты ===== -->
  <rect class="box" x="440" y="1280" width="400" height="80"/>
  <text class="t" x="640" y="1305">Отчёты и сайт</text>
  <text class="s" x="640" y="1325">один шаблон Rmd → 12 страниц · GitHub Pages</text>
  <text class="m" x="640" y="1347">reports/</text>

  <!-- ===== Легенда ===== -->
  <line x1="40" y1="1405" x2="1250" y2="1405" stroke="#ddd" stroke-width="1"/>
  <path class="LN" d="M60,1428 H108" marker-end="url(#A)"/>
  <text x="120" y="1432" style="font-size:12px;fill:#444">основной путь</text>

  <rect class="on" x="230" y="1419" width="34" height="18"/>
  <text x="274" y="1432" style="font-size:12px;fill:#444">идёт дальше</text>

  <rect class="off" x="380" y="1419" width="34" height="18"/>
  <text x="424" y="1432" style="font-size:12px;fill:#444">учтено, дальше не идёт</text>

  <rect class="box" x="590" y="1419" width="34" height="18"/>
  <path class="ln" d="M624,1428 H650" marker-end="url(#a)"/>
  <text x="660" y="1432" style="font-size:12px;fill:#444">внешний источник</text>

  <rect class="hold" x="800" y="1419" width="34" height="18"/>
  <text x="844" y="1432" style="font-size:12px;fill:#444">на холде</text>

  <text x="940" y="1432" style="font-size:11.5px;fill:#3a3a3a;font-family:Menlo,Consolas,'DejaVu Sans Mono',monospace">people</text>
  <text x="992" y="1432" style="font-size:12px;fill:#444">таблица в targets</text>
</svg>
