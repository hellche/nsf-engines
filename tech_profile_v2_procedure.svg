<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 930" width="1280" height="930">
<title>Профиль технологии: версии v2 и v3</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="A" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
<style>
text { font-family: Helvetica, Arial, "DejaVu Sans", sans-serif; }
.box { fill: #fff; stroke: #222; stroke-width: 1.5; }
.hold { fill: #fff; stroke: #888; stroke-width: 1.5; stroke-dasharray: 6 4; }
.on { fill: #e3ecf9; stroke: #4a6fa5; stroke-width: 2.5; }
.emb { fill: #e6f2ea; stroke: #4f8a62; stroke-width: 2.5; }
.t { font-size: 16px; font-weight: 700; fill: #111; text-anchor: middle; }
.ts { font-size: 14px; font-weight: 700; fill: #111; text-anchor: middle; }
.s { font-size: 12px; fill: #555; text-anchor: middle; }
.m { font-size: 11.5px; fill: #3a3a3a; text-anchor: middle; font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
.hs { font-size: 12px; fill: #777; text-anchor: middle; }
.ln { fill: none; stroke: #222; stroke-width: 1.5; }
.LN { fill: none; stroke: #111; stroke-width: 4; stroke-linejoin: round; }
.dl { fill: none; stroke: #888; stroke-width: 1.5; stroke-dasharray: 6 4; }
.ck { fill: none; stroke: #222; stroke-width: 1.5; stroke-dasharray: 2 3; }
</style>
</defs>

<!-- input -->
<rect class="box" x="490" y="40" width="300" height="70"/>
<text class="t" x="640" y="64">Грант NSF</text>
<text class="s" x="640" y="83">название + аннотация · 12 Engines</text>
<text class="m" x="640" y="101">engines</text>

<path class="ln" d="M640,110 V135 H315 V258" marker-end="url(#a)"/>
<path class="ln" d="M640,135 H965 V158" marker-end="url(#a)"/>

<!-- v3 only: the fixed prompt sits between the grant and the fragments -->
<rect class="box" x="800" y="160" width="330" height="70"/>
<text class="ts" x="965" y="183">Промпт v3</text>
<text class="s" x="965" y="202">зафиксирован · только дословные куски</text>
<text class="m" x="965" y="220">v3_extract_technical.md</text>
<path class="ln" d="M965,230 V258" marker-end="url(#a)"/>

<!-- the two versions differ only in the grant text -->
<rect class="on" x="150" y="260" width="330" height="80"/>
<text class="ts" x="315" y="284">v2 · все предложения</text>
<text class="s" x="315" y="303">название и каждое предложение аннотации</text>
<text class="m" x="315" y="328">tech_v2_sentences</text>

<rect class="emb" x="800" y="260" width="330" height="80"/>
<text class="ts" x="965" y="284">v3 · фрагменты о науке и технологиях</text>
<text class="s" x="965" y="303">проверены на дословность</text>
<text class="m" x="965" y="328">tech_v3_fragments</text>

<path class="ln" d="M315,340 V378" marker-end="url(#a)"/>
<path class="ln" d="M965,340 V378" marker-end="url(#a)"/>

<!-- the same ranking for both -->
<rect class="on" x="150" y="380" width="330" height="90"/>
<text class="ts" x="315" y="404">Рейтинг v2</text>
<text class="s" x="315" y="423">эмбеддинги · каждый пункт получает место</text>
<text class="m" x="315" y="456">tech_v2_rank_oa · _cpc</text>

<rect class="box" x="520" y="380" width="240" height="90"/>
<text class="ts" x="640" y="404">Справочники</text>
<text class="s" x="640" y="423">4 516 тем OpenAlex (SPECTER2)</text>
<text class="s" x="640" y="440">9 867 групп CPC (PatentSBERTa)</text>
<text class="m" x="640" y="459">/topics · CPCTitleList</text>
<path class="ln" d="M520,425 H482" marker-end="url(#a)"/>
<path class="ln" d="M760,425 H798" marker-end="url(#a)"/>

<rect class="emb" x="800" y="380" width="330" height="90"/>
<text class="ts" x="965" y="404">Рейтинг v3</text>
<text class="s" x="965" y="423">те же модели и та же формула</text>
<text class="m" x="965" y="456">tech_v3_rank_oa · _cpc</text>

<!-- comparison -->
<path class="ln" d="M315,470 V545 H438" marker-end="url(#a)"/>
<path class="ln" d="M965,470 V545 H842" marker-end="url(#a)"/>
<rect class="box" x="40" y="530" width="230" height="80"/>
<text class="ts" x="155" y="554">Версия 1 (на сайте)</text>
<text class="s" x="155" y="573">прежний ручной выбор, не эталон</text>
<text class="m" x="155" y="596">tech_profile</text>
<path class="ck" d="M270,585 H438" marker-end="url(#a)"/>
<text class="s" x="355" y="577" style="font-size:11px">для справки</text>

<rect class="box" x="440" y="520" width="400" height="90"/>
<text class="t" x="640" y="545">Сравнение v2 и v3</text>
<text class="s" x="640" y="565">распределения по 12 Engines · место выбора v1</text>
<text class="m" x="640" y="597">tech_v2_v3_summary</text>

<!-- choice and result -->
<path class="LN" d="M640,610 V646" marker-end="url(#A)"/>
<rect class="hold" x="960" y="650" width="260" height="80"/>
<text class="ts" x="1090" y="674" style="fill:#555">LLM-оценка топ-50</text>
<text class="hs" x="1090" y="693">обоснование · цитата</text>
<text class="hs" x="1090" y="712">ещё не запускали</text>
<path class="dl" d="M960,690 H842" marker-end="url(#g)"/>

<rect class="box" x="440" y="650" width="400" height="80"/>
<text class="t" x="640" y="674">Ручной выбор</text>
<text class="s" x="640" y="693">топ-5 тем + топ-5 кодов CPC на Engine</text>
<text class="m" x="640" y="718">tech_choice.csv</text>

<path class="LN" d="M640,730 V766" marker-end="url(#A)"/>
<rect class="box" x="440" y="770" width="400" height="70"/>
<text class="t" x="640" y="794">Профиль технологии</text>
<text class="s" x="640" y="813">выбранная версия → работы и патенты Engine</text>
<text class="m" x="640" y="831">tech_profile_v2</text>

<!-- legend -->
<line x1="40" y1="870" x2="1250" y2="870" stroke="#ddd" stroke-width="1"/>
<path class="LN" d="M50,896 H96" marker-end="url(#A)"/>
<text x="106" y="900" style="font-size:12px;fill:#444">основной путь</text>
<rect class="on" x="215" y="887" width="30" height="18"/>
<text x="253" y="900" style="font-size:12px;fill:#444">v2</text>
<rect class="emb" x="300" y="887" width="30" height="18"/>
<text x="338" y="900" style="font-size:12px;fill:#444">v3</text>
<rect class="box" x="385" y="887" width="30" height="18"/>
<path class="ln" d="M415,896 H438" marker-end="url(#a)"/>
<text x="446" y="900" style="font-size:12px;fill:#444">вход / таблица</text>
<path class="ck" d="M570,896 H605" marker-end="url(#a)"/>
<text x="613" y="900" style="font-size:12px;fill:#444">сравнение для справки</text>
<rect class="hold" x="780" y="887" width="30" height="18"/>
<text x="818" y="900" style="font-size:12px;fill:#444">на холде</text>
<text x="910" y="900" style="font-size:11.5px;fill:#3a3a3a;font-family:Menlo,Consolas,'DejaVu Sans Mono',monospace">tech_v3_rank</text>
<text x="1010" y="900" style="font-size:12px;fill:#444">таблица</text>
</svg>
