# Rebuild the site (docs/) with R/08_render_site.R whenever its sources change on main,
# and commit the new docs/. GitHub Pages already publishes main:/docs.
#
# Only step 8 runs here. Steps 1-7 need local patent parquet files, OpenAlex caches and
# the Python environment, so they still run on the Mac.

name: Render site

on:
  push:
    branches: [main]
    paths:
      - "reports/**"
      - "data/processed/**"
      - "data/manual/**"
      - "*.svg"
      - "R/08_render_site.R"
      - "R/profile.R"
      - ".github/workflows/render-site.yml"
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels a build still running: it would be overwritten by the newer one anyway.
concurrency:
  group: render-site
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::ggplot2
            any::here
            any::scales
            any::htmltools
            any::stringi
            any::purrr
            any::plotly

      - name: Render site
        run: Rscript R/08_render_site.R

      - name: Commit docs/
        # Builds can overlap with the bot's own "Rebuild site" commits. Rules, so a build never fails on docs/:
        #  - if main already has newer sources (anything outside docs/), commit nothing: their own build will run;
        #  - otherwise only docs/ can differ, and this build's docs/ is the newer one: keep it on a conflict
        #    (in a rebase, -X theirs = the commit being replayed, i.e. ours);
        #  - retry the push if main moved in between.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "docs/ unchanged"
            exit 0
          fi
          git commit -m "Rebuild site (docs/)"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet HEAD~1 origin/main -- . ':(exclude)docs'; then
              echo "main has newer sources than this build; leaving docs/ to their build"
              exit 0
            fi
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (main moved), retrying"
            sleep 5
          done
          exit 1
