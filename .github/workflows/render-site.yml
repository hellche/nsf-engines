# Rebuild the site (docs/) with R/08_render_site.R whenever its sources change on main,
# and commit the new docs/. GitHub Pages already publishes main:/docs.
#
# Only step 8 runs here. Steps 1-7 need local patent parquet files, OpenAlex caches and
# the Python environment, so they still run on the Mac.

name: Render site

on:
  push:
    branches: [main]
    paths:
      - "reports/**"
      - "data/processed/**"
      - "data/manual/**"
      - "*.svg"
      - "R/08_render_site.R"
      - "R/profile.R"
      - ".github/workflows/render-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-site
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::ggplot2
            any::here
            any::scales
            any::htmltools
            any::stringi
            any::purrr
            any::plotly

      - name: Render site
        run: Rscript R/08_render_site.R

      - name: Commit docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "docs/ unchanged"
            exit 0
          fi
          git commit -m "Rebuild site (docs/)"
          git pull --rebase origin main
          git push origin HEAD:main
