<marker id="A" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
<marker id="Ab" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E88E5"/></marker>
<marker id="Ao" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF6007"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E88E5"/></marker>
<style>
text { font-family: Helvetica, Arial, "DejaVu Sans", sans-serif; }
.box { fill: #fff; stroke: #222; stroke-width: 1.5; }
.kb { fill: #fff; stroke: #111; stroke-width: 2.5; }
.frame { fill: none; stroke: #222; stroke-width: 1.5; }
.on { fill: #e3ecf9; stroke: #4a6fa5; stroke-width: 2.5; }
.off { fill: #f5f6f8; stroke: #c9d0da; stroke-width: 1.2; }
.t { font-size: 16px; font-weight: 700; fill: #111; text-anchor: middle; }
.ts { font-size: 13.5px; font-weight: 700; fill: #111; text-anchor: middle; }
.tf { font-size: 14.5px; font-weight: 700; fill: #111; text-anchor: middle; }
.s { font-size: 12px; fill: #555; text-anchor: middle; }
.n { font-size: 12px; fill: #111; text-anchor: middle; }
.wip { font-size: 11.5px; font-style: italic; fill: #b35900; text-anchor: middle; }
.cap { font-size: 12px; font-style: italic; fill: #555; text-anchor: middle; }
.offt { font-size: 13.5px; font-weight: 600; fill: #8a8f97; text-anchor: middle; }
.offs { font-size: 11.5px; fill: #a0a5ac; text-anchor: middle; }
.ons { font-size: 11.5px; fill: #2d3f5c; text-anchor: middle; }
.keybox { fill: #f8dfa6; stroke: #c27c00; stroke-width: 3.5; }
.keyt { font-size: 14.5px; font-weight: 700; fill: #6b4100; text-anchor: middle; text-decoration: underline; }
.keyl { font-size: 12px; font-weight: 700; fill: #6b4100; text-anchor: middle; }
a.key:hover .keybox { fill: #f3cd7e; }
.li { font-size: 13px; fill: #222; }
.lib { font-weight: 700; fill: #111; }
.ln { fill: none; stroke: #222; stroke-width: 1.5; }
.LN { fill: none; stroke: #111; stroke-width: 4; stroke-linejoin: round; }
.LB { fill: none; stroke: #1E88E5; stroke-width: 4; stroke-linejoin: round; }
.LO { fill: none; stroke: #FF6007; stroke-width: 4; stroke-linejoin: round; }
.lb { fill: none; stroke: #1E88E5; stroke-width: 1.5; }
.lg { font-size: 12px; fill: #444; }
</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<a href="pipeline.html">
<rect class="kb" x="490" y="20" width="300" height="56"/>
<text class="t" x="640.0" y="44">Engine knowledge base</text>
<text class="s" x="640.0" y="62">from the pipeline</text>
</a>
<path class="LN" d="M640,76 V108" marker-end="url(#A)"/>
<rect class="frame" x="250" y="110" width="780" height="194"/>
<text class="tf" x="640" y="136">Metrics</text>
<text class="s" x="640" y="154">for each Engine</text>
<text class="li" x="285" y="182">•  the region&#x27;s share of the technology relative to the US <tspan style="font-style:italic">(Volume and LQ)</tspan></text>
<text class="li" x="285" y="204">•  share of joint works within the region <tspan style="font-style:italic">(Collaboration)</tspan></text>
<text class="li" x="285" y="226">•  share of assignees from the region <tspan style="font-style:italic">(Local patents)</tspan></text>
<text class="li" x="285" y="248">•  joint works and patents, partner × partner <tspan style="font-style:italic">(Partner network before the award)</tspan></text>
<text class="li" x="285" y="270">•  whom the base cites: region, US, world <tspan style="font-style:italic">(Knowledge sources)</tspan></text>
<text class="li" x="285" y="292">•  patent → paper citations from the region&#x27;s patents <tspan style="font-style:italic">(Reliance on science)</tspan></text>
<rect class="box" x="1065" y="173.0" width="205" height="68"/>
<text class="ts" x="1167.5" y="195.0">Patent → paper links</text>
<text class="wip" x="1167.5" y="213.0">check SciSciNet?</text>
<path class="ln" d="M1065,207.0 H1032" marker-end="url(#a)"/>
<path class="LN" d="M640,304 V342" marker-end="url(#A)"/>
<rect class="frame" x="250" y="344" width="780" height="132"/>
<text class="tf" x="640" y="370">Comparison groups</text>
<text class="li" x="285" y="398">•  <tspan class="lib">Finalists that lost</tspan>: 3 finalists + 14 semi-finalists: what sets the winner apart?</text>
<text class="li" x="285" y="420">•  <tspan class="lib">Georgia</tspan>: 12 profiles × the state of GA: where do we stand?</text>
<text class="li" x="285" y="442">•  <tspan class="lib">Technology leaders</tspan>: all states: why here?</text>
<text class="li" x="285" y="464">•  <tspan class="lib">Same region</tspan>: other technologies</text>
<rect class="box" x="1065" y="368.0" width="205" height="84"/>
<text class="ts" x="1167.5" y="392.0">Competition funnel</text>
<text class="wip" x="1167.5" y="410.0">available?</text>
<text class="s" x="1167.5" y="427.0">applications → finals</text>
<path class="ln" d="M1065,410.0 H1032" marker-end="url(#a)"/>
</svg>