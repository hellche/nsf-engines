<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 506" width="1290" height="506">
<title>NSF Engines: метрики и группы сравнения (в разработке)</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="A" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
<style>
text { font-family: Helvetica, Arial, "DejaVu Sans", sans-serif; }
.box { fill: #fff; stroke: #222; stroke-width: 1.5; }
.kb { fill: #fff; stroke: #111; stroke-width: 2.5; }
.frame { fill: none; stroke: #222; stroke-width: 1.5; }
.on { fill: #e3ecf9; stroke: #4a6fa5; stroke-width: 2.5; }
.off { fill: #f5f6f8; stroke: #c9d0da; stroke-width: 1.2; }
.t { font-size: 16px; font-weight: 700; fill: #111; text-anchor: middle; }
.ts { font-size: 13.5px; font-weight: 700; fill: #111; text-anchor: middle; }
.tf { font-size: 14.5px; font-weight: 700; fill: #111; text-anchor: middle; }
.s { font-size: 12px; fill: #555; text-anchor: middle; }
.n { font-size: 12px; fill: #111; text-anchor: middle; }
.wip { font-size: 11.5px; font-style: italic; fill: #b35900; text-anchor: middle; }
.cap { font-size: 12px; font-style: italic; fill: #555; text-anchor: middle; }
.offt { font-size: 13.5px; font-weight: 600; fill: #8a8f97; text-anchor: middle; }
.offs { font-size: 11.5px; fill: #a0a5ac; text-anchor: middle; }
.ons { font-size: 11.5px; fill: #2d3f5c; text-anchor: middle; }
.keybox { fill: #f8dfa6; stroke: #c27c00; stroke-width: 3.5; }
.keyt { font-size: 14.5px; font-weight: 700; fill: #6b4100; text-anchor: middle; text-decoration: underline; }
.keyl { font-size: 12px; font-weight: 700; fill: #6b4100; text-anchor: middle; }
a.key:hover .keybox { fill: #f3cd7e; }
.li { font-size: 13px; fill: #222; }
.lib { font-weight: 700; fill: #111; }
.ln { fill: none; stroke: #222; stroke-width: 1.5; }
.LN { fill: none; stroke: #111; stroke-width: 4; stroke-linejoin: round; }
.lg { font-size: 12px; fill: #444; }
</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<a href="pipeline.html">
<rect class="kb" x="490" y="20" width="300" height="56"/>
<text class="t" x="640.0" y="44">База знаний Engine</text>
<text class="s" x="640.0" y="62">из пайплайна</text>
</a>
<path class="LN" d="M640,76 V108" marker-end="url(#A)"/>
<rect class="frame" x="250" y="110" width="780" height="194"/>
<text class="tf" x="640" y="136">Метрики</text>
<text class="s" x="640" y="154">по каждому Engine</text>
<text class="li" x="285" y="182">•  доля региона в технологии относительно США <tspan style="font-style:italic">(Объём и LQ)</tspan></text>
<text class="li" x="285" y="204">•  доля совместных работ внутри региона <tspan style="font-style:italic">(Сотрудничество)</tspan></text>
<text class="li" x="285" y="226">•  доля правообладателей из региона <tspan style="font-style:italic">(Местные патенты)</tspan></text>
<text class="li" x="285" y="248">•  совместные работы и патенты, партнёр × партнёр <tspan style="font-style:italic">(Сеть партнёров до гранта)</tspan></text>
<text class="li" x="285" y="270">•  кого цитирует база: регион, США, мир <tspan style="font-style:italic">(Источники знания)</tspan></text>
<text class="li" x="285" y="292">•  ссылки патент → статья из патентов региона <tspan style="font-style:italic">(Опора на науку)</tspan></text>
<rect class="box" x="1065" y="173.0" width="205" height="68"/>
<text class="ts" x="1167.5" y="195.0">Связи патент → статья</text>
<text class="wip" x="1167.5" y="213.0">проверить SciSciNet?</text>
<path class="ln" d="M1065,207.0 H1032" marker-end="url(#a)"/>
<path class="LN" d="M640,304 V342" marker-end="url(#A)"/>
<rect class="frame" x="250" y="344" width="780" height="132"/>
<text class="tf" x="640" y="370">Группы сравнения</text>
<text class="li" x="285" y="398">•  <tspan class="lib">Проигравшие финалисты</tspan>: 3 финалиста + 14 полуфиналистов: что отличает победителя?</text>
<text class="li" x="285" y="420">•  <tspan class="lib">Джорджия</tspan>: 12 профилей × штат GA: где мы?</text>
<text class="li" x="285" y="442">•  <tspan class="lib">Лидеры по технологии</tspan>: все штаты: почему именно здесь?</text>
<text class="li" x="285" y="464">•  <tspan class="lib">Тот же регион</tspan>: другие технологии</text>
<rect class="box" x="1065" y="368.0" width="205" height="84"/>
<text class="ts" x="1167.5" y="392.0">Воронка конкурса</text>
<text class="wip" x="1167.5" y="410.0">доступна?</text>
<text class="s" x="1167.5" y="427.0">заявки → финал</text>
<path class="ln" d="M1065,410.0 H1032" marker-end="url(#a)"/>
</svg>